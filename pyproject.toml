[project]
name = "custom_crm_sync"
authors = [{ name = "Agrovisions", email = "usman.agro7c@gmail.com" }]
description = "Bi-directional Cross-Site Sync between Frappe CRM and ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<17.0.0"
crm = ">=2.0.0-dev,<3.0.0"
